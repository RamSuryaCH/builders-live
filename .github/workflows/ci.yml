name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run secret-scan
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run load-test
      - uses: aws-actions/setup-sam@v2
      - run: pip install cfn-lint
      - run: sam validate --template infra/template.yaml --region ap-southeast-2 --lint
